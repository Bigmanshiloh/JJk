<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jujutsu Kaisen: Cursed Legacy</title><link rel="stylesheet" href="style.css"></head><body><main id="app">
<section id="title"><div class="logo">呪</div><h1>CURSED LEGACY</h1><p>JUJUTSU KAISEN • TOKYO • 2006</p><button onclick="create()">NEW GAME</button><button onclick="load()">LOAD GAME</button><button onclick="help()">HOW TO PLAY</button></section>
<section id="create" class="hide"><h2>JUJUTSU HIGH — 2006</h2><div class="grid"><label>Name<input id="name" value="Ren" maxlength="14"></label><label>Clan<select id="clan"></select></label><label>Cursed Technique<select id="tech"></select></label><label>Trait<select id="trait"></select></label></div><div id="info"></div><button onclick="start()">BEGIN STORY</button><button onclick="home()">BACK</button></section>
<section id="game" class="hide"><header><b id="who"></b><span id="build"></span><span>Lv <b id="lv"></b> • XP <b id="xp"></b></span><span>HP <b id="hp"></b>/<b id="mh"></b> • CE <b id="ce"></b>/<b id="mc"></b></span></header><div class="layout"><aside><b id="season"></b><h3 id="area"></h3><div id="map"></div><div class="dirs"><button onclick="move(-1,0)">◀</button><button onclick="move(0,-1)">▲</button><button onclick="move(0,1)">▼</button><button onclick="move(1,0)">▶</button></div><h3>QUESTS</h3><div id="quests"></div></aside><main class="scene"><div id="story"></div><div id="say"></div><div id="actions"></div></main><aside><h3>PARTY</h3><div id="party"></div><h3>INVENTORY</h3><div id="inv"></div><button onclick="skills()">SKILL TREE</button><button onclick="saves()">SAVE / EXPORT</button></aside></div></section>
<div id="modal" class="hide"><div id="box"><button class="x" onclick="closeM()">×</button><div id="modalBody"></div></div></div></main><script src="game.js"></script></body></html>
